name: Docker Build

on:
  push:
    branches: [ "main", "test", "feature/**" ]
    tags: [ "v*" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'



jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://172.17.0.2:2375
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: git.unfilteredrealm.com
          username: ${{ gitea.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Show image tags
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          REF_TYPE="${GITHUB_REF_TYPE:-branch}"
          REF_NAME="${GITHUB_REF_NAME:-main}"
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$REF_NAME" = "main" ]; then
            TAG="latest"
          else
            TAG="$(printf '%s' "$REF_NAME" | tr '[:upper:]/' '[:lower:]-')"
          fi
          echo "${IMAGE}:${TAG}"

      - name: Build Docker image
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          REF_TYPE="${GITHUB_REF_TYPE:-branch}"
          REF_NAME="${GITHUB_REF_NAME:-main}"
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$REF_NAME" = "main" ]; then
            TAG="latest"
          else
            TAG="$(printf '%s' "$REF_NAME" | tr '[:upper:]/' '[:lower:]-')"
          fi
          docker build \
            --label "org.opencontainers.image.source=https://git.unfilteredrealm.com/wander/ta-organizerr" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${IMAGE}:${TAG}" \
            .
          docker image inspect "${IMAGE}:${TAG}" --format 'Built image {{.Id}} for revision {{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: Push Docker image
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          REF_TYPE="${GITHUB_REF_TYPE:-branch}"
          REF_NAME="${GITHUB_REF_NAME:-main}"
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$REF_NAME" = "main" ]; then
            TAG="latest"
          else
            TAG="$(printf '%s' "$REF_NAME" | tr '[:upper:]/' '[:lower:]-')"
          fi
          docker push "${IMAGE}:${TAG}"

      - name: Verify published image
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          REF_TYPE="${GITHUB_REF_TYPE:-branch}"
          REF_NAME="${GITHUB_REF_NAME:-main}"
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$REF_NAME" = "main" ]; then
            TAG="latest"
          else
            TAG="$(printf '%s' "$REF_NAME" | tr '[:upper:]/' '[:lower:]-')"
          fi
          docker manifest inspect "${IMAGE}:${TAG}" >/tmp/published-manifest.json
          cat /tmp/published-manifest.json
