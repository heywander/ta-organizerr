name: Docker Build

on:
  push:
    branches: [ "main" , "feature/ui-login-rework"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'



jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://172.17.0.2:2375
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: git.unfilteredrealm.com
          username: ${{ gitea.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Show image tags
        run: |
          echo "git.unfilteredrealm.com/wander/ta-organizerr:latest"
          echo "git.unfilteredrealm.com/wander/ta-organizerr:main"
          echo "git.unfilteredrealm.com/wander/ta-organizerr:${{ github.sha }}"

      - name: Build Docker image
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          SHA="${{ github.sha }}"
          docker build \
            --label "org.opencontainers.image.source=https://git.unfilteredrealm.com/wander/ta-organizerr" \
            --label "org.opencontainers.image.revision=${SHA}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:${SHA}" \
            .
          docker image inspect "${IMAGE}:${SHA}" --format 'Built image {{.Id}} for revision {{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: Push Docker image
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          SHA="${{ github.sha }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:${SHA}"

      - name: Verify published image
        run: |
          IMAGE="git.unfilteredrealm.com/wander/ta-organizerr"
          SHA="${{ github.sha }}"
          docker manifest inspect "${IMAGE}:${SHA}" >/tmp/published-manifest.json
          cat /tmp/published-manifest.json
