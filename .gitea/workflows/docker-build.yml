name: Docker Build

on:
  push:
    branches: [ "main" , "feature/ui-login-rework"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'



jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://172.17.0.2:2375
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: git.unfilteredrealm.com
          username: ${{ gitea.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Show image tags
        run: |
          echo "git.unfilteredrealm.com/wander/ta-organizerr:latest"
          echo "git.unfilteredrealm.com/wander/ta-organizerr:main"
          echo "git.unfilteredrealm.com/wander/ta-organizerr:${{ github.sha }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            git.unfilteredrealm.com/wander/ta-organizerr:latest
            git.unfilteredrealm.com/wander/ta-organizerr:main
            git.unfilteredrealm.com/wander/ta-organizerr:${{ github.sha }}
